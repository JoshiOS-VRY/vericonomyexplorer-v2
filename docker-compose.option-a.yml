networks:
  edge:
    driver: bridge
  private:
    driver: bridge

services:
  caddy:
    image: caddy:2.9
    container_name: vericonomy-caddy
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      LEGACY_PUBLIC_DOMAIN: ${LEGACY_PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/option-a/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - explorer-web
      - explorer-express
    networks:
      - edge
      - private

  explorer-web:
    container_name: vericonomy-explorer-web
    build:
      context: .
      dockerfile: explorer-web/Dockerfile
      args:
        EXPLORER_FAST_API_URL: http://explorer-fast-api:3003
        EXPLORER_API_URL: http://explorer-express:3002
    image: vericonomy-explorer-web:option-a
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      PORT: ${WEB_PORT:-3000}
      HOSTNAME: 0.0.0.0
      EXPLORER_API_URL: ${EXPLORER_API_URL:-http://explorer-express:3002}
      EXPLORER_FAST_API_URL: ${EXPLORER_FAST_API_URL:-http://explorer-fast-api:3003}
      VCEXP_FAST_API_HOST: explorer-fast-api
      VCEXP_FAST_API_PORT: ${FAST_API_PORT:-3003}
    expose:
      - "${WEB_PORT:-3000}"
    depends_on:
      - explorer-fast-api
      - explorer-express
    networks:
      - private

  explorer-express:
    container_name: vericonomy-explorer-express
    build:
      context: .
      dockerfile: Dockerfile
    image: vericonomy-explorer-express:option-a
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      BTCEXP_HOST: 0.0.0.0
      BTCEXP_PORT: ${EXPRESS_PORT:-3002}
    expose:
      - "${EXPRESS_PORT:-3002}"
    volumes:
      - vericonomy-cache:/app/cache
      - vericonomy-database:/app/database
      - ./configs/chains.json:/app/configs/chains.json:ro
    networks:
      - private

  explorer-fast-api:
    container_name: vericonomy-explorer-fast-api
    build:
      context: .
      dockerfile: explorer-api/Dockerfile
    image: vericonomy-explorer-fast-api:option-a
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      VCEXP_FAST_API_HOST: 0.0.0.0
      VCEXP_FAST_API_PORT: ${FAST_API_PORT:-3003}
      VCEXP_INDEXER_SQLITE_PATH: ${VCEXP_INDEXER_SQLITE_PATH:-/app/database/vericonomy-index.sqlite}
      VCEXP_CHAINS_CONFIG: ${VCEXP_CHAINS_CONFIG:-/app/configs/chains.json}
      VCEXP_VRM_RPC_HOST: ${VCEXP_VRM_RPC_HOST:-172.18.0.1}
      VCEXP_VRC_RPC_HOST: ${VCEXP_VRC_RPC_HOST:-172.18.0.1}
      VCEXP_API_DB_WORKER_TIMEOUT_MS: ${VCEXP_API_DB_WORKER_TIMEOUT_MS:-30000}
      VCEXP_API_DB_WORKERS: ${VCEXP_API_DB_WORKERS:-3}
      VCEXP_API_DB_FAST_WORKERS: ${VCEXP_API_DB_FAST_WORKERS:-1}
      VCEXP_HOME_NETWORK_ROUTE_TIMEOUT_MS: ${VCEXP_HOME_NETWORK_ROUTE_TIMEOUT_MS:-4000}
      VCEXP_HOME_NETWORK_TIMEOUT_MS: ${VCEXP_HOME_NETWORK_TIMEOUT_MS:-5000}
      VCEXP_HOME_MARKET_ROUTE_TIMEOUT_MS: ${VCEXP_HOME_MARKET_ROUTE_TIMEOUT_MS:-4000}
      VCEXP_MARKET_FETCH_TIMEOUT_MS: ${VCEXP_MARKET_FETCH_TIMEOUT_MS:-4000}
      VCEXP_WEB_FETCH_TIMEOUT_MS: ${VCEXP_WEB_FETCH_TIMEOUT_MS:-5000}
      VCEXP_SQLITE_BUSY_RETRY_ATTEMPTS: ${VCEXP_SQLITE_BUSY_RETRY_ATTEMPTS:-6}
      VCEXP_SQLITE_BUSY_RETRY_DELAY_MS: ${VCEXP_SQLITE_BUSY_RETRY_DELAY_MS:-100}
      VCEXP_API_TX_LOOKUP_TIMEOUT_MS: ${VCEXP_API_TX_LOOKUP_TIMEOUT_MS:-30000}
      VCEXP_SQLITE_CACHE_MB: ${VCEXP_SQLITE_CACHE_MB:-256}
      VCEXP_SQLITE_MMAP_MB: ${VCEXP_SQLITE_MMAP_MB:-256}
      VCEXP_CHAIN_HEALTH_CACHE_MS: ${VCEXP_CHAIN_HEALTH_CACHE_MS:-60000}
    expose:
      - "${FAST_API_PORT:-3003}"
    volumes:
      - vericonomy-database:/app/database
      - ./configs/chains.json:/app/configs/chains.json:ro
    depends_on:
      - explorer-express
    networks:
      - private

  vrm-indexer:
    profiles: ["vrm-catchup"]
    container_name: vericonomy-vrm-indexer
    build:
      context: .
      dockerfile: Dockerfile
    image: vericonomy-vrm-indexer:option-a
    restart: unless-stopped
    healthcheck:
      disable: true
    command:
      [
        "node",
        "./bin/indexer-v2-loop.js",
        "--chain",
        "vrm",
        "--index-only",
        "--batch-size",
        "25",
        "--pause-ms",
        "50",
        "--idle-ms",
        "5000",
        "--log-every",
        "500",
      ]
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      VCEXP_INDEXER_SQLITE_PATH: ${VCEXP_INDEXER_SQLITE_PATH:-/app/database/vericonomy-index.sqlite}
      VCEXP_CHAINS_CONFIG: ${VCEXP_CHAINS_CONFIG:-/app/configs/chains.json}
      VCEXP_VRM_RPC_HOST: ${VCEXP_VRM_RPC_HOST:-172.18.0.1}
      VCEXP_INDEXER_YIELD_MS: ${VCEXP_INDEXER_YIELD_MS:-50}
      VCEXP_INDEXER_BLOCKS_PER_PASS: ${VCEXP_INDEXER_BLOCKS_PER_PASS:-100}
      VCEXP_INDEX_ONLY_RPC_BATCH: ${VCEXP_INDEX_ONLY_RPC_BATCH:-25}
    container_name: vericonomy-vrc-indexer
    build:
      context: .
      dockerfile: Dockerfile
    image: vericonomy-vrc-indexer:option-a
    restart: unless-stopped
    healthcheck:
      disable: true
    command:
      [
        "node",
        "./bin/indexer-v2-loop.js",
        "--chain",
        "vrc",
        "--index-only",
        "--batch-size",
        "25",
        "--pause-ms",
        "50",
        "--log-every",
        "1000",
      ]
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      VCEXP_INDEXER_SQLITE_PATH: ${VCEXP_INDEXER_SQLITE_PATH:-/app/database/vericonomy-index.sqlite}
      VCEXP_CHAINS_CONFIG: ${VCEXP_CHAINS_CONFIG:-/app/configs/chains.json}
      VCEXP_VRC_RPC_HOST: ${VCEXP_VRC_RPC_HOST:-172.18.0.1}
      VCEXP_INDEXER_YIELD_MS: ${VCEXP_INDEXER_YIELD_MS:-50}
      VCEXP_INDEXER_BLOCKS_PER_PASS: ${VCEXP_INDEXER_BLOCKS_PER_PASS:-50}
      VCEXP_INDEX_ONLY_RPC_BATCH: ${VCEXP_INDEX_ONLY_RPC_BATCH:-25}
      VCEXP_INDEXER_BUSY_TIMEOUT_MS: ${VCEXP_INDEXER_BUSY_TIMEOUT_MS:-30000}
      VCEXP_WAL_CHECKPOINT_MODE: ${VCEXP_WAL_CHECKPOINT_MODE:-PASSIVE}
    volumes:
      - vericonomy-database:/app/database
      - ./configs/chains.json:/app/configs/chains.json:ro
    networks:
      - private

volumes:
  caddy_data:
  caddy_config:
  vericonomy-cache:
  vericonomy-database:
