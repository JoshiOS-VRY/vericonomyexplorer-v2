version: "3.8"

networks:
  vericonomy-network:
    driver: bridge

services:
  explorer-api:
    container_name: vericonomy-explorer-api
    build:
      context: .
      dockerfile: Dockerfile
    image: vericonomy-explorer-api:latest
    restart: unless-stopped
    environment:
      BTCEXP_COIN: VRM
      BTCEXP_HOST: 0.0.0.0
      BTCEXP_PORT: 3002
      BTCEXP_DISPLAY_CURRENCY: vrm
      VCEXP_INDEXER_SQLITE_PATH: /app/database/vericonomy-index.sqlite
      VCEXP_CHAINS_CONFIG: /app/configs/chains.vrm-poc.example.json
      BTCEXP_BITCOIND_URI: ${BTCEXP_BITCOIND_URI:-bitcoin://rpcuser:rpcpassword@127.0.0.1:36988/}
    ports:
      - "3002:3002"
    volumes:
      - vericonomy-cache:/app/cache
      - vericonomy-database:/app/database
    networks:
      - vericonomy-network

  explorer-web:
    container_name: vericonomy-explorer-web
    build:
      context: ./explorer-web
      dockerfile: Dockerfile
    image: vericonomy-explorer-web:latest
    restart: unless-stopped
    depends_on:
      - explorer-api
    environment:
      EXPLORER_API_URL: http://explorer-api:3002
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - vericonomy-network

  vrm-indexer:
    container_name: vericonomy-vrm-indexer
    build:
      context: .
      dockerfile: Dockerfile
    image: vericonomy-explorer-api:latest
    restart: unless-stopped
    command: ["npm", "run", "indexer:vrm"]
    environment:
      VCEXP_INDEXER_SQLITE_PATH: /app/database/vericonomy-index.sqlite
      VCEXP_CHAINS_CONFIG: /app/configs/chains.vrm-poc.example.json
      BTCEXP_BITCOIND_URI: ${BTCEXP_BITCOIND_URI:-bitcoin://rpcuser:rpcpassword@127.0.0.1:36988/}
    volumes:
      - vericonomy-database:/app/database
    networks:
      - vericonomy-network

volumes:
  vericonomy-cache:
    driver: local
  vericonomy-database:
    driver: local
